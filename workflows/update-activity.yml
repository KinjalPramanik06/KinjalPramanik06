name: Update recent activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-activity.yml"

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build activity and contribution sections
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;
            const file = 'README.md';
            let md = fs.readFileSync(file, 'utf8');

            const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
            const repoLink = (name) => `[${name}](https://github.com/${name})`;
            const dayOf = (iso) => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

            function replaceSection(name, body) {
              const start = `<!--START_SECTION:${name}-->`;
              const end = `<!--END_SECTION:${name}-->`;
              if (!md.includes(start) || !md.includes(end)) return;
              const re = new RegExp(`${start}[\\s\\S]*?${end}`);
              md = md.replace(re, () => `${start}\n${body}\n${end}`);
            }

            // 1) Recent activity from public events
            const { data: events } = await github.rest.activity.listPublicEventsForUser({
              username: user, per_page: 100,
            });

            const items = [];
            const pushIndex = {};
            for (const e of events) {
              const p = e.payload || {};
              const repo = repoLink(e.repo.name);
              const day = dayOf(e.created_at);
              let text = null;

              switch (e.type) {
                case 'PushEvent': {
                  const n = p.size || (p.commits || []).length || 0;
                  const key = `${e.repo.name}|${day}`;
                  if (pushIndex[key] !== undefined) { items[pushIndex[key]].count += n; continue; }
                  pushIndex[key] = items.length;
                  items.push({ kind: 'push', repo, day, count: n });
                  continue;
                }
                case 'CreateEvent':
                  if (p.ref_type === 'repository') text = `✨ Created repository ${repo}`;
                  break;
                case 'ForkEvent':
                  text = `🍴 Forked ${repo}`;
                  break;
                case 'PullRequestEvent': {
                  const merged = p.pull_request && p.pull_request.merged;
                  const verb = merged ? 'Merged' : cap(p.action || 'updated');
                  text = `🔀 ${verb} PR [#${p.number}](${p.pull_request.html_url}) in ${repo}`;
                  break;
                }
                case 'IssuesEvent':
                  text = `❗ ${cap(p.action || 'updated')} issue [#${p.issue.number}](${p.issue.html_url}) in ${repo}`;
                  break;
                case 'IssueCommentEvent':
                  text = `💬 Commented on [#${p.issue.number}](${p.comment.html_url}) in ${repo}`;
                  break;
                case 'WatchEvent':
                  text = `⭐ Starred ${repo}`;
                  break;
              }
              if (text) items.push({ kind: 'text', text, day });
            }

            const lines = items.slice(0, 6).map((it, i) => {
              const body = it.kind === 'push'
                ? `⬆️ Pushed ${it.count > 0 ? it.count + ' commit' + (it.count === 1 ? '' : 's') : 'changes'} to ${it.repo}`
                : it.text;
              return `${i + 1}. ${body} · ${it.day}`;
            });
            replaceSection('activity', lines.length ? lines.join('\n') : '_No recent public activity yet._');

            // 2) Exact contribution total for the current year (same number GitHub shows)
            try {
              const year = new Date().getUTCFullYear();
              const res = await github.graphql(
                `query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      contributionCalendar { totalContributions }
                    }
                  }
                }`,
                { login: user, from: `${year}-01-01T00:00:00Z`, to: new Date().toISOString() }
              );
              const total = res.user.contributionsCollection.contributionCalendar.totalContributions;
              replaceSection('contrib', `**${total} contributions in ${year}** · [see full activity](https://github.com/${user})`);
            } catch (err) {
              core.warning(`Could not read contribution total: ${err.message}`);
            }

            fs.writeFileSync(file, md);

      - name: Commit changes
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update recent activity"
            git push
          else
            echo "No changes to commit."
          fi
