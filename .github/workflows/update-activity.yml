name: Sync profile (projects, tools, activity, stats)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-activity.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: update-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync pinned projects, tools, activity, streak and stats
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const user = context.repo.owner;
            const file = 'README.md';

            // Repositories to leave out of the language statistics (for example one that is mostly vendored code).
            // Example: const EXCLUDE_LANGUAGE_REPOS = ['my-big-repo'];
            const EXCLUDE_LANGUAGE_REPOS = [];

            let md = fs.readFileSync(file, 'utf8');

            const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
            const repoLink = (name) => `[${name}](https://github.com/${name})`;
            const shortDay = (iso) => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
            const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const compact = (n) => (n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n));

            function replaceSection(name, body) {
              const start = `<!--START_SECTION:${name}-->`;
              const end = `<!--END_SECTION:${name}-->`;
              if (!md.includes(start) || !md.includes(end)) return;
              const re = new RegExp(`${start}[\\s\\S]*?${end}`);
              md = md.replace(re, () => `${start}\n${body}\n${end}`);
            }

            // ---------- 1) Recent activity ----------
            const { data: events } = await github.rest.activity.listPublicEventsForUser({
              username: user, per_page: 100,
            });

            const items = [];
            const pushIndex = {};
            for (const e of events) {
              const p = e.payload || {};
              const repo = repoLink(e.repo.name);
              const day = shortDay(e.created_at);
              let text = null;
              switch (e.type) {
                case 'PushEvent': {
                  const n = p.size || (p.commits || []).length || 0;
                  const key = `${e.repo.name}|${day}`;
                  if (pushIndex[key] !== undefined) { items[pushIndex[key]].count += n; continue; }
                  pushIndex[key] = items.length;
                  items.push({ kind: 'push', repo, day, count: n });
                  continue;
                }
                case 'CreateEvent':
                  if (p.ref_type === 'repository') text = `✨ Created repository ${repo}`;
                  break;
                case 'ForkEvent':
                  text = `🍴 Forked ${repo}`;
                  break;
                case 'PullRequestEvent': {
                  const merged = p.pull_request && p.pull_request.merged;
                  text = `🔀 ${merged ? 'Merged' : cap(p.action || 'updated')} PR [#${p.number}](${p.pull_request.html_url}) in ${repo}`;
                  break;
                }
                case 'IssuesEvent':
                  text = `❗ ${cap(p.action || 'updated')} issue [#${p.issue.number}](${p.issue.html_url}) in ${repo}`;
                  break;
                case 'IssueCommentEvent':
                  text = `💬 Commented on [#${p.issue.number}](${p.comment.html_url}) in ${repo}`;
                  break;
                case 'WatchEvent':
                  text = `⭐ Starred ${repo}`;
                  break;
              }
              if (text) items.push({ kind: 'text', text, day });
            }
            const lines = items.slice(0, 6).map((it, i) => {
              const body = it.kind === 'push'
                ? `⬆️ Pushed ${it.count > 0 ? it.count + ' commit' + (it.count === 1 ? '' : 's') : 'changes'} to ${it.repo}`
                : it.text;
              return `${i + 1}. ${body} · ${it.day}`;
            });
            replaceSection('activity', lines.length ? lines.join('\n') : '_No recent public activity yet._');

            // ---------- 2) Pinned repositories (Featured Projects) ----------
            try {
              const pinRes = await github.graphql(
                `query($login: String!) {
                  user(login: $login) {
                    pinnedItems(first: 6, types: REPOSITORY) {
                      nodes { ... on Repository { name url description stargazerCount isFork primaryLanguage { name } } }
                    }
                  }
                }`,
                { login: user }
              );
              const pins = pinRes.user.pinnedItems.nodes.filter(Boolean);
              if (pins.length) {
                const blocks = pins.map((r) => {
                  const desc = r.description ? r.description.replace(/\s+/g, ' ').trim() : 'No description yet.';
                  const meta = [
                    r.primaryLanguage && r.primaryLanguage.name,
                    r.stargazerCount ? `⭐ ${r.stargazerCount}` : null,
                    r.isFork ? 'Fork' : null,
                  ].filter(Boolean).join(' · ');
                  return `### 📌 [${r.name}](${r.url})\n\n${desc}${meta ? `\n\n<sub>${meta}</sub>` : ''}`;
                });
                replaceSection('projects', blocks.join('\n\n'));
                fs.mkdirSync('assets', { recursive: true });
                fs.writeFileSync('assets/pinned.json', JSON.stringify(pins.map((r) => ({
                  name: r.name, url: r.url, description: r.description || '',
                  language: r.primaryLanguage ? r.primaryLanguage.name : '', stars: r.stargazerCount, fork: r.isFork,
                })), null, 2));
              }
            } catch (err) {
              core.warning(`Could not read pinned repositories: ${err.message}`);
            }

            // ---------- 3) Favorite tools, detected from the projects ----------
            try {
              const INCLUDE_FORKS = true;                              // also scan forks you own
              const ALWAYS = ['git', 'github', 'vscode', 'md'];        // tools you always want listed
              const CACHE_VERSION = 1;

              // id (skillicons name), label, official site, category
              const TOOLS = [
                ['c', 'C', 'https://en.cppreference.com/w/c', 'lang'],
                ['cpp', 'C++', 'https://isocpp.org/', 'lang'],
                ['cs', 'C#', 'https://learn.microsoft.com/dotnet/csharp/', 'lang'],
                ['java', 'Java', 'https://www.java.com/', 'lang'],
                ['js', 'JavaScript', 'https://developer.mozilla.org/en-US/docs/Web/JavaScript', 'lang'],
                ['ts', 'TypeScript', 'https://www.typescriptlang.org/', 'lang'],
                ['py', 'Python', 'https://www.python.org/', 'lang'],
                ['html', 'HTML', 'https://developer.mozilla.org/en-US/docs/Web/HTML', 'lang'],
                ['css', 'CSS', 'https://developer.mozilla.org/en-US/docs/Web/CSS', 'lang'],
                ['sass', 'Sass', 'https://sass-lang.com/', 'lang'],
                ['php', 'PHP', 'https://www.php.net/', 'lang'],
                ['go', 'Go', 'https://go.dev/', 'lang'],
                ['rust', 'Rust', 'https://www.rust-lang.org/', 'lang'],
                ['kotlin', 'Kotlin', 'https://kotlinlang.org/', 'lang'],
                ['swift', 'Swift', 'https://www.swift.org/', 'lang'],
                ['dart', 'Dart', 'https://dart.dev/', 'lang'],
                ['ruby', 'Ruby', 'https://www.ruby-lang.org/', 'lang'],
                ['bash', 'Shell', 'https://www.gnu.org/software/bash/', 'lang'],
                ['powershell', 'PowerShell', 'https://learn.microsoft.com/powershell/', 'lang'],
                ['r', 'R', 'https://www.r-project.org/', 'lang'],
                ['md', 'Markdown', 'https://www.markdownguide.org/', 'lang'],
                ['nodejs', 'Node.js', 'https://nodejs.org/', 'fw'],
                ['react', 'React', 'https://react.dev/', 'fw'],
                ['nextjs', 'Next.js', 'https://nextjs.org/', 'fw'],
                ['vue', 'Vue', 'https://vuejs.org/', 'fw'],
                ['angular', 'Angular', 'https://angular.dev/', 'fw'],
                ['svelte', 'Svelte', 'https://svelte.dev/', 'fw'],
                ['express', 'Express', 'https://expressjs.com/', 'fw'],
                ['nestjs', 'NestJS', 'https://nestjs.com/', 'fw'],
                ['tailwind', 'Tailwind CSS', 'https://tailwindcss.com/', 'fw'],
                ['bootstrap', 'Bootstrap', 'https://getbootstrap.com/', 'fw'],
                ['vite', 'Vite', 'https://vitejs.dev/', 'fw'],
                ['webpack', 'Webpack', 'https://webpack.js.org/', 'fw'],
                ['jquery', 'jQuery', 'https://jquery.com/', 'fw'],
                ['threejs', 'Three.js', 'https://threejs.org/', 'fw'],
                ['redux', 'Redux', 'https://redux.js.org/', 'fw'],
                ['electron', 'Electron', 'https://www.electronjs.org/', 'fw'],
                ['prisma', 'Prisma', 'https://www.prisma.io/', 'fw'],
                ['graphql', 'GraphQL', 'https://graphql.org/', 'fw'],
                ['spring', 'Spring', 'https://spring.io/', 'fw'],
                ['flask', 'Flask', 'https://flask.palletsprojects.com/', 'fw'],
                ['django', 'Django', 'https://www.djangoproject.com/', 'fw'],
                ['fastapi', 'FastAPI', 'https://fastapi.tiangolo.com/', 'fw'],
                ['tensorflow', 'TensorFlow', 'https://www.tensorflow.org/', 'fw'],
                ['pytorch', 'PyTorch', 'https://pytorch.org/', 'fw'],
                ['sklearn', 'scikit-learn', 'https://scikit-learn.org/', 'fw'],
                ['opencv', 'OpenCV', 'https://opencv.org/', 'fw'],
                ['mongodb', 'MongoDB', 'https://www.mongodb.com/', 'db'],
                ['mysql', 'MySQL', 'https://www.mysql.com/', 'db'],
                ['postgres', 'PostgreSQL', 'https://www.postgresql.org/', 'db'],
                ['sqlite', 'SQLite', 'https://www.sqlite.org/', 'db'],
                ['redis', 'Redis', 'https://redis.io/', 'db'],
                ['firebase', 'Firebase', 'https://firebase.google.com/', 'db'],
                ['vercel', 'Vercel', 'https://vercel.com/', 'db'],
                ['netlify', 'Netlify', 'https://www.netlify.com/', 'db'],
                ['githubpages', 'GitHub Pages', 'https://pages.github.com/', 'db'],
                ['git', 'Git', 'https://git-scm.com/', 'tool'],
                ['github', 'GitHub', 'https://github.com/', 'tool'],
                ['githubactions', 'GitHub Actions', 'https://github.com/features/actions', 'tool'],
                ['vscode', 'VS Code', 'https://code.visualstudio.com/', 'tool'],
                ['docker', 'Docker', 'https://www.docker.com/', 'tool'],
                ['maven', 'Maven', 'https://maven.apache.org/', 'tool'],
                ['gradle', 'Gradle', 'https://gradle.org/', 'tool'],
              ];
              const iconOf = (id) => (id === 'githubpages' ? 'github' : id);

              const LANGS = {
                C: 'c', 'C++': 'cpp', 'C#': 'cs', Java: 'java', JavaScript: 'js', TypeScript: 'ts', Python: 'py',
                'Jupyter Notebook': 'py', HTML: 'html', CSS: 'css', SCSS: 'sass', Sass: 'sass', PHP: 'php', Go: 'go',
                Rust: 'rust', Kotlin: 'kotlin', Swift: 'swift', Dart: 'dart', Ruby: 'ruby', Shell: 'bash',
                PowerShell: 'powershell', R: 'r', Dockerfile: 'docker', Vue: 'vue', Svelte: 'svelte',
              };
              const PKGS = {
                react: 'react', 'react-dom': 'react', next: 'nextjs', vue: 'vue', '@angular/core': 'angular', svelte: 'svelte',
                express: 'express', '@nestjs/core': 'nestjs', tailwindcss: 'tailwind', bootstrap: 'bootstrap', vite: 'vite',
                webpack: 'webpack', jquery: 'jquery', three: 'threejs', redux: 'redux', '@reduxjs/toolkit': 'redux',
                electron: 'electron', prisma: 'prisma', '@prisma/client': 'prisma', graphql: 'graphql',
                mongoose: 'mongodb', mongodb: 'mongodb', mysql: 'mysql', mysql2: 'mysql', pg: 'postgres',
                sqlite3: 'sqlite', 'better-sqlite3': 'sqlite', redis: 'redis', firebase: 'firebase', 'firebase-admin': 'firebase',
                sass: 'sass', flask: 'flask', django: 'django', fastapi: 'fastapi', tensorflow: 'tensorflow',
                torch: 'pytorch', pytorch: 'pytorch', 'scikit-learn': 'sklearn', sklearn: 'sklearn',
                'opencv-python': 'opencv', 'opencv-python-headless': 'opencv',
              };

              async function readFile(owner, repo, path, ref) {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
                return Buffer.from(data.content, 'base64').toString('utf8');
              }

              // Returns a list of tool ids for one repository, or null if it could not be scanned.
              async function scanRepo(owner, repo) {
                const found = new Set();
                let info;
                try {
                  info = (await github.rest.repos.get({ owner, repo })).data;
                } catch (e) { return null; }
                if (info.has_pages) found.add('githubpages');

                try {
                  const { data } = await github.rest.repos.listLanguages({ owner, repo });
                  for (const name of Object.keys(data)) if (LANGS[name]) found.add(LANGS[name]);
                } catch (e) { /* ignore */ }

                const manifests = [];
                try {
                  const { data } = await github.rest.git.getTree({ owner, repo, tree_sha: info.default_branch, recursive: 'true' });
                  for (const node of data.tree) {
                    if (node.type !== 'blob') continue;
                    const path = node.path;
                    if (/(^|\/)(node_modules|vendor|dist|build)\//.test(path)) continue;
                    const base = path.split('/').pop();
                    if (base === 'package.json') { found.add('nodejs'); manifests.push(['npm', path]); }
                    else if (base === 'requirements.txt') manifests.push(['pip', path]);
                    else if (base === 'pom.xml') { found.add('maven'); manifests.push(['maven', path]); }
                    else if (/^build\.gradle(\.kts)?$|^settings\.gradle(\.kts)?$/.test(base)) found.add('gradle');
                    else if (base === 'Dockerfile' || /^docker-compose/.test(base)) found.add('docker');
                    else if (base === 'vercel.json') found.add('vercel');
                    else if (base === 'netlify.toml') found.add('netlify');
                    else if (base === 'firebase.json') found.add('firebase');
                    else if (/^tailwind\.config\./.test(base)) found.add('tailwind');
                    else if (/^vite\.config\./.test(base)) found.add('vite');
                    else if (/^next\.config\./.test(base)) found.add('nextjs');
                    else if (/^webpack\.config\./.test(base)) found.add('webpack');
                    if (path.startsWith('.github/workflows/')) found.add('githubactions');
                    if (path.startsWith('.vscode/')) found.add('vscode');
                  }
                } catch (e) { /* ignore */ }

                for (const [kind, path] of manifests.slice(0, 6)) {
                  try {
                    const text = await readFile(owner, repo, path, info.default_branch);
                    if (kind === 'npm') {
                      const pkg = JSON.parse(text);
                      for (const n of Object.keys({ ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) }))
                        if (PKGS[n.toLowerCase()]) found.add(PKGS[n.toLowerCase()]);
                    } else if (kind === 'pip') {
                      for (const line of text.split(/\r?\n/)) {
                        const n = line.trim().split(/[<>=!~\[; ]/)[0].toLowerCase();
                        if (n && PKGS[n]) found.add(PKGS[n]);
                      }
                    } else if (kind === 'maven') {
                      if (/springframework/i.test(text)) found.add('spring');
                    }
                  } catch (e) { /* ignore */ }
                }
                return [...found];
              }

              const repoRes = await github.graphql(
                `query($login: String!) {
                  user(login: $login) {
                    repositories(ownerAffiliations: OWNER, first: 100, orderBy: { field: PUSHED_AT, direction: DESC }) {
                      nodes { name isFork pushedAt owner { login } }
                    }
                    repositoriesContributedTo(first: 50, includeUserRepositories: false, contributionTypes: [COMMIT, PULL_REQUEST], orderBy: { field: PUSHED_AT, direction: DESC }) {
                      nodes { name isFork pushedAt owner { login } }
                    }
                  }
                }`,
                { login: user }
              );
              const seen = new Set();
              const list = [];
              const addRepos = (nodes, owned) => {
                for (const r of nodes) {
                  if (!r) continue;
                  if (owned && r.isFork && !INCLUDE_FORKS) continue;
                  const key = `${r.owner.login}/${r.name}`;
                  if (seen.has(key)) continue;
                  seen.add(key);
                  list.push({ key, owner: r.owner.login, name: r.name, pushedAt: r.pushedAt });
                }
              };
              addRepos(repoRes.user.repositories.nodes, true);
              addRepos(repoRes.user.repositoriesContributedTo.nodes, false);

              fs.mkdirSync('assets', { recursive: true });
              const cachePath = 'assets/tools-cache.json';
              let cache = {};
              try {
                const c = JSON.parse(fs.readFileSync(cachePath, 'utf8'));
                if (c.version === CACHE_VERSION) cache = c.repos || {};
              } catch (e) { /* first run */ }

              const nextCache = {};
              const used = new Set(ALWAYS);
              for (const r of list.slice(0, 80)) {
                let tools;
                if (cache[r.key] && cache[r.key].pushedAt === r.pushedAt) {
                  tools = cache[r.key].tools;
                } else {
                  const scanned = await scanRepo(r.owner, r.name);
                  tools = scanned === null ? (cache[r.key] ? cache[r.key].tools : []) : scanned;
                  if (scanned === null) { nextCache[r.key] = { pushedAt: null, tools }; tools.forEach((t) => used.add(t)); continue; }
                }
                nextCache[r.key] = { pushedAt: r.pushedAt, tools };
                tools.forEach((t) => used.add(t));
              }

              const CATS = [
                ['lang', '👨‍💻', 'Programming and Markup Languages'],
                ['fw', '🧰', 'Frameworks and Libraries'],
                ['db', '🗄️', 'Databases and Hosting'],
                ['tool', '💻', 'Software and Tools'],
              ];
              const blocks = [];
              const json = [];
              for (const [cat, emoji, title] of CATS) {
                const chosen = TOOLS.filter((t) => t[3] === cat && used.has(t[0]));
                if (!chosen.length) continue;
                const imgs = chosen.map(([id, label, url]) =>
                  `  <a href="${url}" target="_blank" rel="noreferrer"><img src="https://skillicons.dev/icons?i=${iconOf(id)}&theme=dark" width="36" height="36" alt="${label}" title="${label}" /></a>`
                ).join('\n');
                blocks.push(`### ${emoji} ${title}\n\n<p>\n${imgs}\n</p>`);
                json.push({ title: `${emoji} ${title}`, tools: chosen.map(([id, label, url]) => ({ id: iconOf(id), label, url })) });
              }
              if (blocks.length) replaceSection('tools', blocks.join('\n\n'));
              fs.writeFileSync('assets/tools.json', JSON.stringify(json, null, 2));
              fs.writeFileSync(cachePath, JSON.stringify({ version: CACHE_VERSION, repos: nextCache }, null, 2));
              core.info(`Tools detected from ${list.length} repositories: ${[...used].join(', ')}`);
            } catch (err) {
              core.warning(`Could not detect tools: ${err.message}`);
            }

            fs.writeFileSync(file, md);
            fs.mkdirSync('assets', { recursive: true });

            // ---------- 3) Streak and profile stats, computed from GitHub's own data ----------
            try {
              const yearsRes = await github.graphql(
                `query($login: String!) { user(login: $login) { contributionsCollection { contributionYears } } }`,
                { login: user }
              );
              const years = yearsRes.user.contributionsCollection.contributionYears;
              const now = new Date();
              const counts = {};
              const totals = { commits: 0, prs: 0, issues: 0 };

              for (const y of years) {
                const from = `${y}-01-01T00:00:00Z`;
                const to = y === now.getUTCFullYear() ? now.toISOString() : `${y}-12-31T23:59:59Z`;
                const res = await github.graphql(
                  `query($login: String!, $from: DateTime!, $to: DateTime!) {
                    user(login: $login) {
                      contributionsCollection(from: $from, to: $to) {
                        totalCommitContributions
                        totalPullRequestContributions
                        totalIssueContributions
                        contributionCalendar { weeks { contributionDays { date contributionCount } } }
                      }
                    }
                  }`,
                  { login: user, from, to }
                );
                const cc = res.user.contributionsCollection;
                totals.commits += cc.totalCommitContributions;
                totals.prs += cc.totalPullRequestContributions;
                totals.issues += cc.totalIssueContributions;
                for (const w of cc.contributionCalendar.weeks)
                  for (const d of w.contributionDays) counts[d.date] = d.contributionCount;
              }

              const todayStr = now.toISOString().slice(0, 10);
              const days = Object.keys(counts).filter((d) => d <= todayStr).sort();
              const total = days.reduce((s, d) => s + counts[d], 0);
              const first = days.find((d) => counts[d] > 0);

              const fmt = (d) => {
                const dt = new Date(d + 'T00:00:00Z');
                const base = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
                return dt.getUTCFullYear() === now.getUTCFullYear() ? base : `${base}, ${dt.getUTCFullYear()}`;
              };
              const range = (a, b) => (a === b ? fmt(a) : `${fmt(a)} - ${fmt(b)}`);

              let best = { len: 0, start: null, end: null }, run = { len: 0, start: null, end: null };
              for (const d of days) {
                if (counts[d] > 0) {
                  if (run.len === 0) run = { len: 1, start: d, end: d };
                  else run = { len: run.len + 1, start: run.start, end: d };
                  if (run.len > best.len) best = { ...run };
                } else run = { len: 0, start: null, end: null };
              }
              let i = days.length - 1;
              if (i >= 0 && counts[days[i]] === 0) i--;
              let cur = { len: 0, start: null, end: null };
              while (i >= 0 && counts[days[i]] > 0) {
                cur = { len: cur.len + 1, start: days[i], end: cur.end || days[i] };
                i--;
              }

              const streakSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="${total} total contributions, ${cur.len} day current streak, ${best.len} day longest streak">
            <style>text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;text-anchor:middle}.num{font-size:28px;font-weight:700;fill:#E6EDF3}.lbl{font-size:14px;fill:#C9D1D9}.dt{font-size:12px;fill:#94A3B8}.cur{font-size:14px;font-weight:700;fill:#67E8F9}</style>
            <rect width="495" height="195" rx="4.5" fill="#0D1117"/>
            <line x1="165" y1="28" x2="165" y2="167" stroke="#30363D" stroke-width="1"/>
            <line x1="330" y1="28" x2="330" y2="167" stroke="#30363D" stroke-width="1"/>
            <text class="num" x="82.5" y="86">${esc(total)}</text>
            <text class="lbl" x="82.5" y="114">Total Contributions</text>
            <text class="dt" x="82.5" y="138">${first ? esc(fmt(first)) + ' - Present' : '-'}</text>
            <circle cx="247.5" cy="75" r="40" fill="none" stroke="#06B6D4" stroke-width="5"/>
            <text class="num" x="247.5" y="86">${esc(cur.len)}</text>
            <g transform="translate(247.5,35)"><circle r="12" fill="#0D1117"/><path d="M0 -9 C3 -5 7 -3 7 2 C7 6 4 9 0 9 C-4 9 -7 6 -7 2 C-7 -1 -5 -3 -4 -6 C-2 -4 -1 -4 0 -9 Z" fill="#A78BFA"/></g>
            <text class="cur" x="247.5" y="140">Current Streak</text>
            <text class="dt" x="247.5" y="160">${cur.len ? esc(range(cur.start, cur.end)) : '-'}</text>
            <text class="num" x="412.5" y="86">${esc(best.len)}</text>
            <text class="lbl" x="412.5" y="114">Longest Streak</text>
            <text class="dt" x="412.5" y="138">${best.len ? esc(range(best.start, best.end)) : '-'}</text>
            </svg>`;
              fs.writeFileSync('assets/streak.svg', streakSvg);
              core.info(`Streak card: total=${total}, current=${cur.len}, longest=${best.len}`);

              // Stats + languages (own, non-fork repositories)
              const recent = await github.graphql(
                `query($login: String!) {
                  user(login: $login) {
                    displayName: name
                    contributionsCollection { totalRepositoriesWithContributedCommits }
                    repositories(ownerAffiliations: OWNER, isFork: false, first: 100) {
                      nodes {
                        name
                        stargazerCount
                        languages(first: 10, orderBy: { field: SIZE, direction: DESC }) {
                          edges { size node { name color } }
                        }
                      }
                    }
                  }
                }`,
                { login: user }
              );
              const u = recent.user;
              const repos = u.repositories.nodes;
              const stars = repos.reduce((s, r) => s + r.stargazerCount, 0);
              const contributedTo = u.contributionsCollection.totalRepositoriesWithContributedCommits;
              const title = `${u.displayName || user}'s GitHub Stats`;

              const icons = {
                star: '<polygon points="7,1 8.8,5.2 13.3,5.6 9.9,8.6 10.9,13 7,10.7 3.1,13 4.1,8.6 0.7,5.6 5.2,5.2"/>',
                commit: '<circle cx="7" cy="7" r="6"/><path d="M7 3.5V7l2.5 1.5"/>',
                pr: '<circle cx="3.5" cy="3" r="1.8"/><circle cx="3.5" cy="11" r="1.8"/><circle cx="10.5" cy="11" r="1.8"/><path d="M3.5 4.8V9.2M10.5 9.2V5.5Q10.5 3.5 8.5 3.5H7"/>',
                issue: '<circle cx="7" cy="7" r="6"/><circle cx="7" cy="7" r="0.9" fill="#A78BFA"/>',
                repo: '<path d="M3 1.5h8v11H3zM3 10h8"/>',
              };
              const rows = [
                ['star', 'Total Stars Earned:', compact(stars)],
                ['commit', 'Total Commits:', compact(totals.commits)],
                ['pr', 'Total PRs:', compact(totals.prs)],
                ['issue', 'Total Issues:', compact(totals.issues)],
                ['repo', 'Contributed to (last year):', compact(contributedTo)],
              ];
              const rowSvg = rows.map(([ic, label, val], k) => {
                const y = 66 + k * 26;
                return `<g transform="translate(24,${y - 11})" fill="none" stroke="#A78BFA" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">${icons[ic]}</g>
            <text class="row" x="48" y="${y}">${esc(label)}</text><text class="row val" x="396" y="${y}">${esc(val)}</text>`;
              }).join('\n');
              const statsSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="420" height="195" viewBox="0 0 420 195" role="img" aria-label="${esc(title)}: ${stars} stars, ${totals.commits} commits, ${totals.prs} pull requests, ${totals.issues} issues">
            <style>text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.title{font-size:18px;font-weight:600;fill:#67E8F9}.row{font-size:14px;font-weight:600;fill:#C9D1D9}.val{text-anchor:end}</style>
            <rect width="420" height="195" rx="4.5" fill="#0D1117"/>
            <text class="title" x="24" y="34">${esc(title)}</text>
            ${rowSvg}
            </svg>`;
              fs.writeFileSync('assets/stats.svg', statsSvg);

              const bytes = {};
              const colors = {};
              for (const r of repos) {
                if (EXCLUDE_LANGUAGE_REPOS.includes(r.name)) continue;
                for (const e of r.languages.edges) {
                  bytes[e.node.name] = (bytes[e.node.name] || 0) + e.size;
                  colors[e.node.name] = e.node.color || '#8B949E';
                }
              }
              const totalBytes = Object.values(bytes).reduce((a, b) => a + b, 0);
              const langs = Object.entries(bytes).sort((a, b) => b[1] - a[1]).slice(0, 6)
                .map(([name, size]) => ({ name, pct: totalBytes ? (size / totalBytes) * 100 : 0, color: colors[name] }));

              const BAR_X = 24, BAR_W = 312;
              let cx = BAR_X;
              const segs = langs.map((l) => {
                const w = Math.max(2, (l.pct / 100) * BAR_W);
                const s = `<rect x="${cx.toFixed(2)}" y="56" width="${w.toFixed(2)}" height="8" fill="${l.color}"/>`;
                cx += w;
                return s;
              }).join('');
              const legend = langs.map((l, k) => {
                const x = k % 2 === 0 ? 24 : 190, y = 92 + Math.floor(k / 2) * 26;
                return `<circle cx="${x + 5}" cy="${y - 4}" r="5" fill="${l.color}"/><text class="lg" x="${x + 16}" y="${y}">${esc(l.name)} ${l.pct.toFixed(2)}%</text>`;
              }).join('\n');
              const langSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="195" viewBox="0 0 360 195" role="img" aria-label="Most used languages">
            <style>text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.title{font-size:18px;font-weight:600;fill:#67E8F9}.lg{font-size:12px;fill:#C9D1D9}</style>
            <rect width="360" height="195" rx="4.5" fill="#0D1117"/>
            <text class="title" x="24" y="34">Most Used Languages</text>
            <clipPath id="bar"><rect x="${BAR_X}" y="56" width="${BAR_W}" height="8" rx="4"/></clipPath>
            <g clip-path="url(#bar)"><rect x="${BAR_X}" y="56" width="${BAR_W}" height="8" fill="#30363D"/>${segs}</g>
            ${legend}
            </svg>`;
              fs.writeFileSync('assets/languages.svg', langSvg);
              core.info(`Stats: stars=${stars}, commits=${totals.commits}, prs=${totals.prs}, issues=${totals.issues}, contributedTo=${contributedTo}`);
            } catch (err) {
              core.warning(`Could not build stats cards: ${err.message}`);
            }

      - name: Commit changes
        run: |
          git add -A -- README.md
          [ -d assets ] && git add -A -- assets || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: sync profile data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
