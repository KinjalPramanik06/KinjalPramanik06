<svg xmlns="http://www.w3.org/2000/svg" width="887" height="216" viewBox="0 0 887 216" role="img" aria-label="Kinjal Pramanik. Ideas, Algorithms, Impact. Turning curiosity into code, and code into possibilities.">
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;text-anchor:middle}
    .name{font-size:34px;font-weight:700;fill:#67E8F9}
    .tag{font-size:19px;font-weight:700;fill:#C9D1D9}
    .sub{font-size:17px;font-style:italic;fill:#8B949E}
    .pill{font-size:12.5px;font-weight:700;letter-spacing:.4px}
    .shimmer{animation:sweep 5.5s ease-in-out infinite}
    .sparkle{fill:#F0FDFF;opacity:0;animation:twinkle 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .sparkle:nth-child(2){animation-delay:1.3s}
    .sparkle:nth-child(3){animation-delay:2.7s}
    .sparkle:nth-child(4){animation-delay:.7s}
    @keyframes sweep{0%,18%{transform:translateX(270px);opacity:0}25%{opacity:.85}60%{transform:translateX(610px);opacity:.85}67%,100%{transform:translateX(610px);opacity:0}}
    @keyframes twinkle{0%,12%,42%,100%{opacity:0;transform:scale(.4)}27%{opacity:.9;transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){.shimmer,.sparkle{animation:none;opacity:0}}
  </style>
  <defs>
    <linearGradient id="shine"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="name-clip"><text class="name" x="443.5" y="66">Kinjal Pramanik</text></clipPath>
  </defs>
  <rect x="1" y="1" width="885" height="214" rx="14" fill="#0A0D12" stroke="#21262D" stroke-width="2"/>

  <text class="name" x="443.5" y="66">Kinjal Pramanik</text>
  <g clip-path="url(#name-clip)"><rect class="shimmer" x="0" y="32" width="65" height="40" fill="url(#shine)"/></g>
  <g aria-hidden="true">
    <path class="sparkle" d="M337 35l1.3 4.7L343 41l-4.7 1.3L337 47l-1.3-4.7L331 41l4.7-1.3Z"/>
    <path class="sparkle" d="M414 56l1 3L418 60l-3 1L414 64l-1-3L410 60l3-1Z"/>
    <path class="sparkle" d="M525 34l1.2 4.8L531 40l-4.8 1.2L525 46l-1.2-4.8L519 40l4.8-1.2Z"/>
    <path class="sparkle" d="M565 54l1 3L569 58l-3 1L565 62l-1-3L561 58l3-1Z"/>
  </g>
  <text class="tag" x="443.5" y="108">Ideas → Algorithms → Impact</text>
  <text class="sub" x="443.5" y="146">Turning curiosity into code, and code into possibilities.</text>

  <rect x="340.5" y="168" width="46" height="24" rx="12" fill="#272B33"/>
  <text class="pill" x="363.5" y="184" fill="#E6EDF3">DSA</text>
  <rect x="394.5" y="168" width="76" height="24" rx="12" fill="#0B2342"/>
  <text class="pill" x="432.5" y="184" fill="#3B82F6">WEB DEV</text>
  <rect x="478.5" y="168" width="68" height="24" rx="12" fill="#2B1F4D"/>
  <text class="pill" x="512.5" y="184" fill="#A78BFA">AI / ML</text>
</svg>
